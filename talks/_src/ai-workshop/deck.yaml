- id: training-vocab
  layout: standard
  title: AI Training vocab
  body: |-
    ## Pre-training

    The process through which a model learns raw input (usually language), knowledge, etc.

    Constrained by arithmetic capacity 

    ---

    ## Post-training / RL (Reinforcement Learning)

    When an AI is fine-tuned to provide more precise answers, to avoid giving dangerous answers, etc.


    Constrained by memory bandwidth

    ---

    ## Inference

    Running the trained model on new input to produce output.

    Constrained by memory bandwidth

    ---

    ## Alignment

    The goal: produce an AI which can do what we want and not do what we don't want (for instance extinct us).

  class: property-highlights term-cards

