- id: menu-1
  layout: standard
  title: Project menu
  kicker: Geometry, topology, analysis
  body: |-
    | Project | First working version | Independent check |
    |---|---|---|
    | **Lattice-point explorer** \newline \small{geometry, combinatorics} | Plot three polygons and count points in their dilates | Square and triangle formulas |
    | **Graph Laplacian explorer** \newline \small{spectral theory} | Draw a small graph and display its Laplacian eigenvalues | The 4-cycle has eigenvalues $0,2,2,4$ |
    | **Simplicial homology calculator** \newline \small{topology} | Enter a small complex; compute boundary matrices over $\mathbb F_2$ | Hollow triangle $(b_0,b_1)=(1,1)$; filled $(1,0)$ |
    | **Fourier approximation explorer** \newline \small{analysis} | Plot partial Fourier sums of a square wave | Odd symmetry; values at selected points |
    | **Logistic-map explorer** \newline \small{dynamics} | Plot orbits of $x_{k+1}=rx_k(1-x_k)$ with parameter controls | At $r=2$, $x_0=\tfrac12$ gives a constant orbit |
    | **Plane cubic family** \newline \small{algebraic geometry} | Plot $y^2=x^3+ax+b$ while varying $a,b$ | Singular exactly when $4a^3+27b^2=0$ |
  class: compact menu-table
- id: menu-2
  layout: standard
  title: Project menu
  kicker: Algebra, combinatorics, numerics
  body: |-
    | Project | First working version | Independent check |
    |---|---|---|
    | **Finite-field point counter** \newline \small{number theory} | Count points on $y^2=x^3+ax+b$ for small primes $p>3$ | $y^2=x^3+x+1$ over $\mathbb F_5$ has 9 projective points |
    | **Dyck-path generator** \newline \small{enumerative combinatorics} | Generate and draw all Dyck paths for small $n$ | Counts begin $1,1,2,5,14$ |
    | **Monomial-ideal staircase** \newline \small{commutative algebra} | Draw the monomials surviving modulo a supplied ideal | For $(x^3,xy,y^2)$: $1,x,x^2,y$ |
    | **Young-tableau generator** \newline \small{representation theory} | Enumerate standard tableaux of a small shape | Shape $(3,2)$ has 5 standard tableaux |
    | **Matrix perturbation experiment** \newline \small{linear algebra} | Perturb a small matrix; compare eigenvalues and eigenvectors | Trace, determinant, eigenvector residuals |
    | **Quadrature comparison** \newline \small{numerical analysis} | Compare integration methods as resolution increases | $\int_0^1x^2\,dx=\tfrac13$ |
  class: compact menu-table

- id: aesthetic
  layout: standard
  kicker: Personalize the vibe
  title: AI aesthetic slop
  body: |-
    
    - Border-radius roundrect, dark mode/light mode
    - Beige, white, black
    - Post-Fontawesome icons
    - Sans serif
    - Whitespace, letter spacing

    AI will default to its internal aesthetics when generating visuals. You can tweak this - hand it a color palette, a font, an inspiration page, etc.

    E.g. how could we use the [early 2010's parallax trend](https://examples.motion.dev/js/parallax) for math visualization?

    ---

    ![Aesthetics](assets/ai-aesthetics.png)
  footer: Photo from [Jim Nielsen's blog](https://blog.jim-nielsen.com/2026/ai-aesthetic/)
  design:
    preset: columns-2

- id: directions
  layout: standard
  title: Beyond “make a visualization”
  kicker: Project directions
  body: |-
    ### Generate examples

    Enumerate objects satisfying explicit conditions and display representative cases.

    ---

    ### Search for counterexamples

    Specify a bounded search space and return a witness that can be checked independently.

    ---

    ### Compare algorithms

    Implement two approaches; examine agreement, speed, or numerical error.

    ---

    ### Generate a visual for teaching

    Make a visual (interactive or not) for use in a class you're teaching

    ---

    ### Make a figure for a paper or talk

    Convert a precise mathematical specification into an editable, reproducible diagram.
    
  class: property-highlights term-cards tall-cards
