- id: section-lab
  layout: section
  title: Hands-on work
  kicker: '5'
  nav_title: Hands-on
  body: Work in pairs. One person drives the interface; the other checks definitions and examples. Switch halfway.
- id: template
  layout: standard
  title: A prompt template
  kicker: Adapt it to your project
  body: PAPERSTATEMENT
  statement_label: Prompt template
  statement: |-
    I want to investigate `[mathematical question]`.

    The objects and conventions are `[definitions]`.

    Build the smallest working `[notebook / script / interactive page]` that takes `[input]` and produces `[output]`.

    Start with `[specific example]`. A result I already know is `[check]`.

    Use `[exact arithmetic / a stated numerical precision]`. Run the computation if your environment supports it, and distinguish executed results from proposed code.

    Get the basic version working first. Then suggest one useful extension.
  class: prompt-slide
- id: followups
  layout: standard
  title: Follow-up prompts
  kicker: As important as the first prompt
  body: |-
    - “Here is the error message. Diagnose it and make the smallest correction.”
    - “Explain the mathematical algorithm before changing the code.”
    - “Test the empty, smallest, or degenerate case.”
    - “Find a small example where this proposed pattern fails.”
    - “Change this convention and rerun the examples.”
    - “Save the current working version and explain how to reproduce the result.”
  class: followups
- id: checkpoints
  layout: standard
  title: Hands-on work
  kicker: Checkpoints · minutes 25–52
  body: |-
    | Minutes | Task | Checkpoint |
    |---|---|---|
    | 25–28 | Choose a project; write its input, output, and a known example | A three-sentence project brief |
    | 28–38 | Build the smallest working version | Something runs and produces output |
    | 38–44 | Check a known case and one edge case | A recorded comparison |
    | 44–50 | Add one mathematically motivated extension | A new example, feature, or experiment |
    | 50–52 | Rerun and save the project | A reusable file with short instructions |

    > Driver and checker switch at minute 38.
  class: compact
- id: section-share
  layout: section
  title: Share-out
  kicker: '6'
  body: Three short demonstrations, then save your work.
- id: demonstrations
  layout: split
  title: Three short demonstrations
  kicker: Two minutes per pair
  body: |-
    Each pair shows

    1. **one output**,
    2. **one check**: how you know it is right,
    3. **one next question**.

    Corrections and surprises count as results.
  visual: process-flow
- id: save
  layout: standard
  title: Before you leave
  kicker: Save what you made
  body: |-
    Keep four things together:

    - the **file** that runs, with a line on how to run it;
    - the **prompts** that worked, including the follow-ups;
    - the **check** you ran, and its result;
    - the **next question** you would ask.

    > Next time, start from your saved file and your next question, not from a blank prompt.
