- id: working-vocab
  layout: standard
  title: Working with an AI
  kicker: The model and what it sees
  body: |-

    ### Model / LLM

    The specific system that generates responses given input (Claude Opus 5.5, GPT Astra, etc.)

    ---

    ### Prompt

    The request you send the AI, generally in plain text.

    ---

    ### Token

    A unit into which text is divided for processing: a word, part of a word, or punctuation.

    ---

    ### Context window

    The bounded amount of information available to the model during a response.

    *This is different from training.*

    ---

    ### CLI

    A command-line interface accepts typed commands; a terminal is the application where you use it.

    *An AI coding assistant can work here as well as in a graphical app.*

  class: property-highlights term-cards


- id: why-cli
  layout: standard
  title: Why work with a CLI versus Desktop app
  body: |-
    **CLI advantages**:
    - Automatic context by working directory
    - automation
    - permissions modes

    **Desktop app advantages**:
    - Graphics
    - UI
    - Diff review

    ---

    ![Claude Code CLI](assets/cli-screenshot.png)
  design:
    preset: columns-2

- id: vocabulary-more
  layout: standard
  title: More AI vocab
  body: |-
    ### Agent

    A system that repeatedly chooses actions, uses tools, inspects results, and continues toward its goal.

    *Agentic coding*: letting an agent edit files, run code, etc.

    ---
    
    ### API

    A defined interface through which programs request functionality from other programs or services.

    *Useful for putting AI inside a script or a larger workflow.*

    ---

    ### MCP

    Model Context Protocol: a standard for connecting AI applications to external tools and data.

    *It can give access to a computation service or a reference collection.*

    ---

    ### Weights

    Very literally scalar matrix entries. These are the learned numbers that define the model.
        
    *Open weight* models can be downloaded and run locally (Kimi, Qwen, etc.)


  class: property-highlights term-cards

- id: computed
  layout: standard
  title: Displayed code versus executed code
  kicker: Has anything been computed yet?
  body: |-
    A response can contain code that has never run.

    - **Proposed code** is text the model wrote.
    - **An executed result** is output from a program that actually ran.

    Before trusting a number, find the execution output, or run the code yourself.

    > Ask: “Run the computation if your environment supports it, and distinguish executed results from proposed code.”
  code_title: Python · lattice points in nP
  code: |-
    # Lattice points in nP, P = triangle (0,0), (2,1), (1,3)
    def L(n):
        V = [(0, 0), (2*n, n), (n, 3*n)]
        def inside(x, y):  # (x, y) is on the left of every edge
            return all((b[0]-a[0])*(y-a[1]) >= (b[1]-a[1])*(x-a[0])
                       for a, b in zip(V, V[1:] + V[:1]))
        return sum(inside(x, y) for x in range(2*n + 1)
                                for y in range(3*n + 1))

    print([L(n) for n in range(7)])
  code_result: \texttt{[1, 5, 14, 28, 47, 71, 100]}
  class: with-code explained

