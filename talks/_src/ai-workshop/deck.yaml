- id: problem
  layout: problem
  title: How many lattice points lie in the dilates of a lattice polygon?
  kicker: 'Problem:'
  body: $$L_P(n)=\#\bigl(nP\cap\mathbb Z^2\bigr),\qquad n=0,1,2,\ldots$$

- id: specification
  layout: split
  title: Lattice-point explorer
  kicker: The specification
  body: |-
    The finished demo contains only

    - three preset polygons,
    - a dilation slider,
    - a picture separating boundary and interior points,
    - a table of counts, with first and second differences,
    - a file that runs again after download.

    One self-contained HTML file: it opens in a browser with nothing to install.
  visual: lattice-dilates

- id: timeline
  layout: standard
  title: Lattice-point explorer
  kicker: Ten minutes, live
  body: |-
    | Minutes | Presenter action | What participants learn |
    |---|---|---|
    | 0–1 | State the question; submit the initial request | Turn a mathematical intention into a bounded task |
    | 1–4 | Generate and open the first version | AI can produce a usable computational artifact |
    | 4–6 | Check the square and triangle; inspect how points are counted | Correctness requires more than a convincing picture |
    | 6–8 | Add finite differences and a candidate formula | Refine the tool with a mathematical follow-up |
    | 8–10 | Test more values; save the result | Complete a small project and keep it |
  class: compact
- id: prompt-1
  layout: standard
  title: Lattice-point explorer
  kicker: Prompt 1 · the initial request
  body: |-

    PAPERSTATEMENT
  statement_label: Prompt
  statement: |-
    Build a small interactive explorer for counting lattice points in dilates of convex polygons. Make a single self-contained HTML file that opens in a browser without installing anything.

    Include the unit square, the triangle with vertices (0,0), (1,0), (0,1), and the triangle with vertices (0,0), (2,1), (1,3).

    Add a slider for integer dilations n = 0, …, 6. Draw the dilated polygon and distinguish interior and boundary lattice points. Show a table of the total counts.

    Compute the counts by enumerating lattice points, using exact integer tests. Handle n = 0 explicitly. Keep the interface simple and explain the counting method briefly.
  class: prompt-slide
- id: prompt-2
  layout: standard
  title: Lattice-point explorer
  kicker: Prompt 2 · make verification visible
  body: |-
    There are two counts we know by hand, the square and the triangle:

    $$\#\bigl(n[0,1]^2\cap\mathbb Z^2\bigr)=(n+1)^2,\qquad \#\bigl(n\Delta\cap\mathbb Z^2\bigr)=\dfrac{(n+1)(n+2)}{2},$$

    where $\Delta$ is the triangle with vertices $(0,0),(1,0),(0,1)$.

    PAPERSTATEMENT
  statement_label: Prompt
  statement: Check the output against $(n+1)^2$ for the unit square and $(n+1)(n+2)/2$ for the standard triangle, for every displayed value of n. Show the comparison. Keep the enumeration separate from these checking formulas.
  class: prompt-slide
- id: prompt-3
  layout: standard
  title: Lattice-point explorer
  kicker: Prompt 3 · a mathematical refinement
  body: |-
    Refine the tool with a mathematical follow-up.

    PAPERSTATEMENT
  statement_label: Prompt
  statement: Add first and second differences to the count table. Fit a quadratic using only the values at n = 0, 1, 2, then compare its predictions with the independently enumerated values at n = 3, 4, 5, 6. Label the fit as a candidate formula.
  class: prompt-slide
- id: counts
  layout: standard
  title: Lattice-point explorer
  kicker: What the tool should report
  body: |-
    For the triangle $P$ with vertices $(0,0),(2,1),(1,3)$, exact enumeration gives

    | $n$ | 0 | 1 | 2 | 3 | 4 | 5 | 6 |
    |---|---|---|---|---|---|---|---|
    | $L_P(n)$ | 1 | 5 | 14 | 28 | 47 | 71 | 100 |
    | first difference |  | 4 | 9 | 14 | 19 | 24 | 29 |
    | second difference |  |  | 5 | 5 | 5 | 5 | 5 |

    > Candidate from $n=0,1,2$: $\;L_P(n)=\tfrac52n^2+\tfrac32n+1$. Three values determine a quadratic; four further matches are evidence, not a proof.
  class: result-table
- id: theorem
  layout: standard
  title: Lattice-point explorer
  kicker: The theorem supplies the general conclusion
  body: |-
    PAPERSTATEMENT

    For $P$ with vertices $(0,0),(2,1),(1,3)$: $A=\tfrac52$ and each edge has lattice length $1$, so $B=3$. This recovers the candidate.

    In dimension $2$ the formula follows from Pick’s theorem; Ehrhart proved that $L_P$ is a polynomial of degree $\dim P$ for every lattice polytope $P$.
  statement_label: Theorem (Pick 1899; Ehrhart 1962)
  statement: |-
    Let $P\subset\mathbb R^2$ be a convex polygon with vertices in $\mathbb Z^2$, area $A$, and $B$ lattice points on its boundary. For every integer $n\ge 0$,
    $$L_P(n)=A\,n^2+\frac{B}{2}\,n+1.$$
  class: has-statement explained
# - id: rational-extension
#   layout: standard
#   title: Lattice-point explorer
#   kicker: Extension · a rational polygon
#   body: |-
#     Change to $P=[0,\tfrac12]^2$. Then
#     $$L_P(n)=\bigl(\lfloor n/2\rfloor+1\bigr)^2:\qquad 1,\ 1,\ 4,\ 4,\ 9,\ 9,\ 16,\ \ldots$$
#     A quadratic fit to $n=0,1,2$ fails at $n=3$. Even and odd $n$ follow different quadratics:
#     $$L_P(n)=\begin{cases}\tfrac14n^2+n+1, & n\text{ even},\\[2pt] \tfrac14n^2+\tfrac12n+\tfrac14, & n\text{ odd}.\end{cases}$$

#     > Keep this as an audience-driven extension or a participant project.
#   class: explained

- id: section-lanuages
  layout: section
  title: What already exists
  kicker: '3'
  body: "Don't reinvent the wheel, exploit the existing coding ecosystem"

- id: reuse-vs-reinvent
  layout: standard
  title: For visualization
  kicker: Build on established libraries
  body: |-

    ### Do

    - Ask for a visualization to be written in a precise language if you know it or prefer it
    - Default to HTML visualizations (AI will do this automatically)
    - Use pre-existing open source libraries like matplotlib, three.js

    ---

    ### Don't

    - Ask for an output which is costly for the AI to render (e.g. a 1080p mp4 file)
    - Ask the AI to compile something large that you could compile yourself without burning tokens
    - Work internal to a closed-source software environment when an open-source one would work
  design:
    preset: columns-2
  class: check-x

- id: reuse-vs-reinvent-software
  layout: standard
  title: For coding
  kicker: Build on established libraries
  body: |-

    ### Do

    - Default to well-documented open-source mathematical software (SageMath, Macaulay2, GAP, OSCAR, Julia)
    - Learn the pre-existing ecosystem (which languages are good for which tasks)

    ---

    ### Don't

    - Use proprietary software (e.g. Mathematica, Magma, etc.) without a good reason to -- AI isn't trained as well on this software, and it can't easily test its output without an MCP

  design:
    preset: columns-2
  class: check-x


- id: dodont-data
  layout: standard
  title: For data
  body: |-

    ### Do

    - Build your data from trusted software or sources
    - Learn standard data formats (CSV, JSON, YAML) and keep your data in one of these formats
    - Version control your working environment
    - Ask AI to read the file
    
    ---
    
    ### Don't

    - Ask AI to modify your data file
    - Ask AI to generate the data for you - instead ask it to generate the code that produces the data! The distinction is important
  design:
    preset: columns-2
  class: check-x
