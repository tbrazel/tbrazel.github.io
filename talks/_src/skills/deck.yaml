  body: |-
    Define 'work'...

    We need to **benchmark** this in some capacity. This should happen *before writing the SKILLS file* - we need to determine what it means for this to succeed

    For me, Claude with the arXiV skill file is comparably accurate to without it (BibTeX looks the same, dates aren't fudged, etc.) but the number of API calls is fewer and the latency is increased!

- id: data
  layout: standard
  title: For the skill I wrote
  body: |-
    - Valid BibTeX: 85% → 100%
    - Correct first-version date: 91% → 100%
    - No unsupported "published" claims: 93% → 100%

    Claude described the number of data points I used to get this data as "statistically insignificant" (rude)

- id: todo
  layout: standard
  title: In this session
  body: |-
    1. In small groups determine a skill you would like Claude to have. (Optional: set this up in a repo)
    1. Before writing the skill, determine **benchmarks** for whether Claude has improved by using the skill or not.
    1. Write the skill file referring to Anthropic's [best practices](https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices)
    1. (Optional) Test it against the benchmarks and demonstrate it works!


