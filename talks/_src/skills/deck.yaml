- id: definition
  layout: standard
  title: A working definition
  body: |-
    A **skill** is a reusable, modular set of instructions that extend the capabilities of your AI (Claude for this talk), giving them instructions for a particular domain of work.

    To quote from Anthropic's [overview](https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview), the main benefits are to

    - **Specialize Claude**: tailor capabilities for domain-specific tasks
    - **Reduce repetition**: create once, use automatically
    - **Compose capabilities**: combine Skills for complex, multistep tasks


- id: components
  layout: standard
  title: Components
  kicker: The pieces of a skill
  body: >

    1. **Metadata (written in YAML)**: contains name and description. Loaded at startup, costs very few tokens

    1. **SKILL.md file (Markdown)**: contains a set of instructions. Loaded when triggered, costs less than 5k tokens

    1. **Resources (various)**: reference files, scripts, run when needed.

    


- id: example
  layout: standard
  title: Example - reading arXiV
  kicker: arXiV example
  body: |-
    YAML title and description at the top of file:
    ```
    ---
    name: researching-arxiv-papers
    description: Finds, retrieves, reads, and cites arXiv preprints. Use when the user mentions arXiv, 
    gives an arXiv ID or URL, or asks to search, summarize, compare, or cite preprints or recent
    research papers.
    ---
    ```

- id: example-cont
  layout: standard
  title: Example (continued)
  kicker: arXiV example
  body: |-
    ```
    # arXiv papers
    ## Identifiers
    Normalize every reference to a bare ID before doing anything else. Strip `https://arxiv.org/abs/`,
    `/pdf/`, `.pdf`, and any `arXiv:` prefix.

    - New-style IDs look like `2401.12345` or `2401.12345v2`. They have 5 digits after the dot
    from 2015 on, and 4 digits for 2007–2014.
    - Old-style IDs look like `hep-th/9901001`.
    - An ID without `vN` means the latest version. Keep the version whenever you quote or rely on
    specific content.
    ```

- id: example-link
  layout: standard
  title: Example (link)

