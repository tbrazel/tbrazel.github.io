- id: installing
  layout: standard
  title: Installing

  body: |-

    - For the Desktop app, put the SKILL.md file inside a folder with the skill title, e.g. `researching-arxiv-papers/SKILL.md.`
    - Zip this folder
    - In the Desktop app, go to `Customize > Skills > +` then Upload


