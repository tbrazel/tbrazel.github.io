2\" cy=\"26\" r=\"2.6\"/\u003e\u003c/svg\u003e\n      \u003cfigcaption\u003e\u003cspan class=\"lp-key boundary\"\u003e\u003c/span\u003eboundary 9\u003cspan class=\"lp-key interior\"\u003e\u003c/span\u003einterior 19\u003cbr\u003e28 lattice points in 3\u003ci\u003eP\u003c/i\u003e\u003c/figcaption\u003e\n    \u003c/figure\u003e\u003cp\u003eOpen the explorer from the online slides.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e02\u003c/span\u003e\u003c/footer\u003e"}, {"id": "goal", "title": "Today’s goal", "nav": "Today’s goal", "layout": "split", "class": "slide layout-split  ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eWhat you leave with\u003c/p\u003e\u003ch1\u003eToday’s goal\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cp\u003eEveryone leaves with\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ea small mathematical tool you can \u003cstrong\u003ererun\u003c/strong\u003e,\u003c/li\u003e\n\u003cli\u003ean example you have \u003cstrong\u003echecked\u003c/strong\u003e,\u003c/li\u003e\n\u003cli\u003ea useful \u003cstrong\u003enext question\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe point is a repeatable process, not a particular program.\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"visual \"\u003e\u003col class=\"process-flow\" aria-label=\"State a problem, build something small, inspect the output, check it, refine it\"\u003e\n      \u003cli\u003e\u003cspan class=\"step-index\"\u003e1\u003c/span\u003e\u003cspan\u003eState a problem\u003c/span\u003e\u003c/li\u003e\n      \u003cli\u003e\u003cspan class=\"step-index\"\u003e2\u003c/span\u003e\u003cspan\u003eBuild something small\u003c/span\u003e\u003c/li\u003e\n      \u003cli\u003e\u003cspan class=\"step-index\"\u003e3\u003c/span\u003e\u003cspan\u003eInspect the output\u003c/span\u003e\u003c/li\u003e\n      \u003cli\u003e\u003cspan class=\"step-index\"\u003e4\u003c/span\u003e\u003cspan\u003eCheck it against a known case\u003c/span\u003e\u003c/li\u003e\n      \u003cli\u003e\u003cspan class=\"step-index\"\u003e5\u003c/span\u003e\u003cspan\u003eRefine it, then repeat\u003c/span\u003e\u003c/li\u003e\n    \u003c/ol\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e03\u003c/span\u003e\u003c/footer\u003e"}, {"id": "schedule", "title": "The hour", "nav": "The hour", "layout": "standard", "class": "slide layout-standard compact ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eSchedule\u003c/p\u003e\u003ch1\u003eThe hour\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMinutes\u003c/th\u003e\n\u003cth\u003eActivity\u003c/th\u003e\n\u003cth\u003eIntended result\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e0–3\u003c/td\u003e\n\u003ctd\u003eShow the finished demo; state today’s goal\u003c/td\u003e\n\u003ctd\u003eSee something you could make\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e3–11\u003c/td\u003e\n\u003ctd\u003eEssential AI vocabulary\u003c/td\u003e\n\u003ctd\u003eUnderstand what the interface is doing\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11–21\u003c/td\u003e\n\u003ctd\u003eBuild one project live\u003c/td\u003e\n\u003ctd\u003eSee the whole process, from request to usable output\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e21–25\u003c/td\u003e\n\u003ctd\u003eChoose a project; form pairs\u003c/td\u003e\n\u003ctd\u003eEveryone has a bounded task\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e25–52\u003c/td\u003e\n\u003ctd\u003eHands-on work\u003c/td\u003e\n\u003ctd\u003eA first working version and one checked example\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e52–58\u003c/td\u003e\n\u003ctd\u003eThree short participant demonstrations\u003c/td\u003e\n\u003ctd\u003eA useful result, correction, or surprise\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e58–60\u003c/td\u003e\n\u003ctd\u003eSave outputs; name the next step\u003c/td\u003e\n\u003ctd\u003eLeave with something reusable\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e04\u003c/span\u003e\u003c/footer\u003e"}, {"id": "section-vocabulary", "title": "Vocabulary", "nav": "Vocabulary", "layout": "section", "class": "slide layout-section  ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cp class=\"eyebrow\"\u003e1\u003c/p\u003e\u003ch1\u003eVocabulary\u003c/h1\u003e\u003cdiv class=\"slide-content\"\u003e\u003cp\u003eWhat the interface is doing, in terms you will meet today.\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e05\u003c/span\u003e\u003c/footer\u003e"}, {"id": "training-vocab", "title": "AI Training vocab", "nav": "AI Training vocab", "layout": "standard", "class": "slide layout-standard property-highlights term-cards ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003e\u003c/p\u003e\u003ch1\u003eAI Training vocab\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cdiv class=\"property-grid\"\u003e\u003csection class=\"property-card\"\u003e\u003ch2\u003ePretraining\u003c/h2\u003e\n\u003cp\u003eThe process through which a model learns raw input (usually language), knowledge, etc.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eMathematics: backpropagation calculus, linear algebra\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch2\u003ePost-training / RL (Reinforcement Learning) / Alignment\u003c/h2\u003e\n\u003cp\u003eWhen an AI is fine-tuned to provide more precise answers, to avoid giving dangerous answers, etc.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eMathematics: gradient descent, multivariable calculus\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch2\u003eInference\u003c/h2\u003e\n\u003cp\u003eWhen an AI is applied to produce new knowledge (e.g. it is trained on new data) to see how it performs\u003c/p\u003e\n\u003c/section\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e06\u003c/span\u003e\u003c/footer\u003e"}, {"id": "workload", "title": "Alignment has increasingly become important", "nav": "Alignment has increasingly become important", "layout": "standard", "class": "slide layout-standard  design-align", "style": "--design-align:center", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003e\u003c/p\u003e\u003ch1\u003eAlignment has increasingly become important\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cp\u003e\u003cimg src=\"assets/workload.png\" alt=\"Hasse diagram\" style=\"height: 470px !important;\"\u003e\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e07\u003c/span\u003e\u003c/footer\u003e"}, {"id": "working-vocab", "title": "Working with an AI", "nav": "Working with an AI", "layout": "standard", "class": "slide layout-standard property-highlights term-cards ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eThe model and what it sees\u003c/p\u003e\u003ch1\u003eWorking with an AI\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cdiv class=\"property-grid\"\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003eModel / LLM\u003c/h3\u003e\n\u003cp\u003eThe specific system that generates responses given input (Claude Opus 5.5, GPT Astra, etc.)\u003c/p\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003ePrompt\u003c/h3\u003e\n\u003cp\u003eThe request you send the AI, generally in plain text.\u003c/p\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003eToken\u003c/h3\u003e\n\u003cp\u003eA unit into which text is divided for processing: a word, part of a word, or punctuation.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eLong documents and mathematical notation consume space differently.\u003c/em\u003e\u003c/p\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003eContext window\u003c/h3\u003e\n\u003cp\u003eThe bounded amount of information available to the model during a response.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eThis is different from training.\u003c/em\u003e\u003c/p\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003eCLI\u003c/h3\u003e\n\u003cp\u003eA command-line interface accepts typed commands; a terminal is the application where you use it.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eAn AI coding assistant can work here as well as in a graphical app.\u003c/em\u003e\u003c/p\u003e\n\u003c/section\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e08\u003c/span\u003e\u003c/footer\u003e"}, {"id": "vocabulary-more", "title": "More AI vocab", "nav": "More AI vocab", "layout": "standard", "class": "slide layout-standard property-highlights term-cards ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003e\u003c/p\u003e\u003ch1\u003eMore AI vocab\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cdiv class=\"property-grid\"\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003eAgent\u003c/h3\u003e\n\u003cp\u003eA system that repeatedly chooses actions, uses tools, inspects results, and continues toward a singular goal.\u003c/p\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003eAPI\u003c/h3\u003e\n\u003cp\u003eA defined interface through which programs request functionality from other programs or services.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eUseful for putting AI inside a script or a larger workflow.\u003c/em\u003e\u003c/p\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003eMCP\u003c/h3\u003e\n\u003cp\u003eModel Context Protocol: a standard for connecting AI applications to external tools and data.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eIt can give access to a computation service or a reference collection.\u003c/em\u003e\u003c/p\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003eWeights\u003c/h3\u003e\n\u003cp\u003eVery literally scalars in linear transformations. These are the basics of how the AI functions and are often proprietary. \u003c/p\u003e\n\u003cp\u003e\u003cem\u003eOpen weight\u003c/em\u003e models are open source (Kimi K3, Qwen, etc.)\u003c/p\u003e\n\u003c/section\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e09\u003c/span\u003e\u003c/footer\u003e"}, {"id": "computed", "title": "Displayed code versus executed code", "nav": "Displayed code versus executed code", "layout": "standard", "class": "slide layout-standard with-code explained ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eHas anything been computed yet?\u003c/p\u003e\u003ch1\u003eDisplayed code versus executed code\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cp\u003eA response can contain code that has never run.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eProposed code\u003c/strong\u003e is text the model wrote.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAn executed result\u003c/strong\u003e is output from a program that actually ran.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBefore trusting a number, find the execution output, or run the code yourself.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eAsk: “Run the computation if your environment supports it, and distinguish executed results from proposed code.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"visual \"\u003e\u003csection class=\"code-panel\"\u003e\u003cdiv class=\"code-title\"\u003ePython · lattice points in nP\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e# Lattice points in nP, P = triangle (0,0), (2,1), (1,3)\ndef L(n):\n    V = [(0, 0), (2*n, n), (n, 3*n)]\n    def inside(x, y):  # (x, y) is on the left of every edge\n        return all((b[0]-a[0])*(y-a[1]) \u0026gt;= (b[1]-a[1])*(x-a[0])\n                   for a, b in zip(V, V[1:] + V[:1]))\n    return sum(inside(x, y) for x in range(2*n + 1)\n                            for y in range(3*n + 1))\n\nprint([L(n) for n in range(7)])\u003c/code\u003e\u003c/pre\u003e\u003cdiv class=\"recorded-actions\"\u003e\u003c/div\u003e\u003cp class=\"recorded-caption\"\u003eRecorded output\u003c/p\u003e\u003cdiv class=\"recorded-answer\"\u003e\u003cspan class=\"katex-display\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmtext mathvariant=\"monospace\"\u003e[1,\u003c/mtext\u003e\u003cmtext\u003e \u003c/mtext\u003e\u003cmtext mathvariant=\"monospace\"\u003e5,\u003c/mtext\u003e\u003cmtext\u003e \u003c/mtext\u003e\u003cmtext mathvariant=\"monospace\"\u003e14,\u003c/mtext\u003e\u003cmtext\u003e \u003c/mtext\u003e\u003cmtext mathvariant=\"monospace\"\u003e28,\u003c/mtext\u003e\u003cmtext\u003e \u003c/mtext\u003e\u003cmtext mathvariant=\"monospace\"\u003e47,\u003c/mtext\u003e\u003cmtext\u003e \u003c/mtext\u003e\u003cmtext mathvariant=\"monospace\"\u003e71,\u003c/mtext\u003e\u003cmtext\u003e \u003c/mtext\u003e\u003cmtext mathvariant=\"monospace\"\u003e100]\u003c/mtext\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\texttt{[1, 5, 14, 28, 47, 71, 100]}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.8333em;vertical-align:-0.1389em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord text\"\u003e\u003cspan class=\"mord texttt\"\u003e[1, 5, 14, 28, 47, 71, 100]\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\u003c/section\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e10\u003c/span\u003e\u003c/footer\u003e"}, {"id": "section-demo", "title": "A ten-minute build", "nav": "Demo", "layout": "section", "class": "slide layout-section  ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cp class=\"eyebrow\"\u003e2\u003c/p\u003e\u003ch1\u003eA ten-minute build\u003c/h1\u003e\u003cdiv class=\"slide-content\"\u003e\u003cp\u003eOne project, from a mathematical request to a checked, reusable file.\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e11\u003c/span\u003e\u003c/footer\u003e"}, {"id": "problem", "title": "How many lattice points lie in the dilates of a lattice polygon?", "nav": "How many lattice points lie in the dilates of a lattice polygon?", "layout": "problem", "class": "slide layout-problem  ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cp class=\"eyebrow\"\u003eProblem:\u003c/p\u003e\u003ch1\u003eHow many lattice points lie in the dilates of a lattice polygon?\u003c/h1\u003e\u003cdiv class=\"slide-content\"\u003e\u003cp\u003e\u003cspan class=\"katex-display\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eL\u003c/mi\u003e\u003cmi\u003eP\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003e#\u003c/mi\u003e\u003cmo fence=\"true\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\"\u003e(\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo\u003e∩\u003c/mo\u003e\u003cmsup\u003e\u003cmi mathvariant=\"double-struck\"\u003eZ\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo fence=\"true\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\"\u003e)\u003c/mo\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmspace width=\"2em\"\u003e\u003c/mspace\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmn\u003e2\u003c/mn\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmo\u003e…\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eL_P(n)=\\#\\bigl(nP\\cap\\mathbb Z^2\\bigr),\\qquad n=0,1,2,\\ldots\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord\"\u003e\u003cspan class=\"mord mathnormal\"\u003eL\u003c/span\u003e\u003cspan class=\"msupsub\"\u003e\u003cspan class=\"vlist-t vlist-t2\"\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.3283em;\"\u003e\u003cspan style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\"\u003e\u003cspan class=\"pstrut\" rer", "nav": "Lattice-point explorer", "layout": "split", "class": "slide layout-split  ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eThe specification\u003c/p\u003e\u003ch1\u003eLattice-point explorer\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cp\u003eThe finished demo contains only\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ethree preset polygons,\u003c/li\u003e\n\u003cli\u003ea dilation slider,\u003c/li\u003e\n\u003cli\u003ea picture separating boundary and interior points,\u003c/li\u003e\n\u003cli\u003ea table of counts, with first and second differences,\u003c/li\u003e\n\u003cli\u003ea file that runs again after download.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOne self-contained HTML file: it opens in a browser with nothing to install.\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"visual \"\u003e\u003cfigure class=\"lattice-figure\" role=\"img\" aria-label=\"The triangle with vertices (0,0), (2,1), (1,3) and its dilates by 2 and 3. The third dilate contains 28 lattice points, 9 of them on its boundary.\"\u003e\n      \u003csvg viewBox=\"0 0 268 376\" aria-hidden=\"true\"\u003e\u003cg class=\"lp-grid\"\u003e\u003cpath d=\"M26 350V26\"/\u003e\u003cpath d=\"M62 350V26\"/\u003e\u003cpath d=\"M98 350V26\"/\u003e\u003cpath d=\"M134 350V26\"/\u003e\u003cpath d=\"M170 350V26\"/\u003e\u003cpath d=\"M206 350V26\"/\u003e\u003cpath d=\"M242 350V26\"/\u003e\u003cpath d=\"M26 350H242\"/\u003e\u003cpath d=\"M26 314H242\"/\u003e\u003cpath d=\"M26 278H242\"/\u003e\u003cpath d=\"M26 242H242\"/\u003e\u003cpath d=\"M26 206H242\"/\u003e\u003cpath d=\"M26 170H242\"/\u003e\u003cpath d=\"M26 134H242\"/\u003e\u003cpath d=\"M26 98H242\"/\u003e\u003cpath d=\"M26 62H242\"/\u003e\u003cpath d=\"M26 26H242\"/\u003e\u003c \u003e\u003c/figcaption\u003e\n    \u003c/figure\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e13\u003c/span\u003e\u003c/footer\u003e"}, {"id": "timeline", "title": "Lattice-point explorer", "nav": "Lattice-point explorer", "layout": "standard", "class": "slide layout-standard compact ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eTen minutes, live\u003c/p\u003e\u003ch1\u003eLattice-point explorer\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMinutes\u003c/th\u003e\n\u003cth\u003ePresenter action\u003c/th\u003e\n\u003cth\u003eWhat participants learn\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e0–1\u003c/td\u003e\n\u003ctd\u003eState the question; submit the initial request\u003c/td\u003e\n\u003ctd\u003eTurn a mathematical intention into a bounded task\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1–4\u003c/td\u003e\n\u003ctd\u003eGenerate and open the first version\u003c/td\u003e\n\u003ctd\u003eAI can produce a usable computational artifact\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e4–6\u003c/td\u003e\n\u003ctd\u003eCheck the square and triangle; inspect how points are counted\u003c/td\u003e\n\u003ctd\u003eCorrectness requires more than a convincing picture\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e6–8\u003c/td\u003e\n\u003ctd\u003eAdd finite differences and a candidate formula\u003c/td\u003e\n\u003ctd\u003eRefine the tool with a mathematical follow-up\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e8–10\u003c/td\u003e\n\u003ctd\u003eTest more values; save the result\u003c/td\u003e\n\u003ctd\u003eComplete a small project and keep it\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e14\u003c/span\u003e\u003c/footer\u003e"}, {"id": "prompt-1", "title": "Lattice-point explorer", "nav": "Lattice-point explorer", "layout": "standard", "class": "slide layout-standard prompt-slide ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003ePrompt 1 · the initial request\u003c/p\u003e\u003ch1\u003eLattice-point explorer\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003csection class=\"paper-statement\"\u003e\u003cdiv class=\"statement-label\"\u003ePrompt\u003c/div\u003e\u003cdiv class=\"statement-text\"\u003e\u003cp\u003eBuild a small interactive explorer for counting lattice points in dilates of convex polygons. Make a single self-contained HTML file that opens in a browser without installing anything.\u003c/p\u003e\n\u003cp\u003eInclude the unit square, the triangle with vertices (0,0), (1,0), (0,1), and the triangle with vertices (0,0), (2,1), (1,3).\u003c/p\u003e\n\u003cp\u003eAdd a slider for integer dilations n = 0, …, 6. Draw the dilated polygon and distinguish interior and boundary lattice points. Show a table of the total counts.\u003c/p\u003e\n\u003cp\u003eCompute the counts by enumerating lattice points, using exact integer tests. Handle n = 0 explicitly. Keep the interface simple and explain the counting method briefly.\u003c/p\u003e\n\u003c/div\u003e\u003c/section\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e15\u003c/span\u003e\u003c/footer\u003e"}, {"id": "prompt-2", "title": "Lattice-point explorer", "nav": "Lattice-point explorer", "layout": "standard", "class": "slide layout-standard prompt-slide ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003ePrompt 2 · make verification visible\u003c/p\u003e\u003ch1\u003eLattice-point explorer\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cp\u003eThere are two counts we know by hand, the square and the triangle:\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"katex-display\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003e#\u003c/mi\u003e\u003cmo fence=\"true\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\"\u003e(\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e[\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmsup\u003e\u003cmo stretchy=\"false\"\u003e]\u003c/mo\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e∩\u003c/mo\u003e\u003cmsup\u003e\u003cmi mathvariant=\"double-struck\"\u003eZ\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo fence=\"true\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmsup\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmspace width=\"2em\"\u003e\u003c/mspace\u003e\u003cmi mathvariant=\ \u003cspan class=\"slide-number\"\u003e26\u003c/span\u003e\u003c/footer\u003e"}, {"id": "template", "title": "A prompt template", "nav": "A prompt template", "layout": "standard", "class": "slide layout-standard prompt-slide ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eAdapt it to your project\u003c/p\u003e\u003ch1\u003eA prompt template\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003csection class=\"paper-statement\"\u003e\u003cdiv class=\"statement-label\"\u003ePrompt template\u003c/div\u003e\u003cdiv class=\"statement-text\"\u003e\u003cp\u003eI want to investigate \u003ccode\u003e[mathematical question]\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe objects and conventions are \u003ccode\u003e[definitions]\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eBuild the smallest working \u003ccode\u003e[notebook / script / interactive page]\u003c/code\u003e that takes \u003ccode\u003e[input]\u003c/code\u003e and produces \u003ccode\u003e[output]\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eStart with \u003ccode\u003e[specific example]\u003c/code\u003e. A result I already know is \u003ccode\u003e[check]\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eUse \u003ccode\u003e[exact arithmetic / a stated numerical precision]\u003c/code\u003e. Run the computation if your environment supports it, and distinguish executed results from proposed code.\u003c/p\u003e\n\u003cp\u003eGet the basic version working first. Then suggest one useful extension.\u003c/p\u003e\n\u003c/div\u003e\u003c/section\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e27\u003c/span\u003e\u003c/footer\u003e"}, {"id": "followups", "title": "Follow-up prompts", "nav": "Follow-up prompts", "layout": "standard", "class": "slide layout-standard followups ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eAs important as the first prompt\u003c/p\u003e\u003ch1\u003eFollow-up prompts\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cul\u003e\n\u003cli\u003e“Here is the error message. Diagnose it and make the smallest correction.”\u003c/li\u003e\n\u003cli\u003e“Explain the mathematical algorithm before changing the code.”\u003c/li\u003e\n\u003cli\u003e“Test the empty, smallest, or degenerate case.”\u003c/li\u003e\n\u003cli\u003e“Find a small example where this proposed pattern fails.”\u003c/li\u003e\n\u003cli\u003e“Change this convention and rerun the examples.”\u003c/li\u003e\n\u003cli\u003e“Save the current working version and explain how to reproduce the result.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e28\u003c/span\u003e\u003c/footer\u003e"}, {"id": "checkpoints", "title": "Hands-on work", "nav": "Hands-on work", "layout": "standard", "class": "slide layout-standard compact ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eCheckpoints · minutes 25–52\u003c/p\u003e\u003ch1\u003eHands-on work\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMinutes\u003c/th\u003e\n\u003cth\u003eTask\u003c/th\u003e\n\u003cth\u003eCheckpoint\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e25–28\u003c/td\u003e\n\u003ctd\u003eChoose a project; write its input, output, and a known example\u003c/td\u003e\n\u003ctd\u003eA three-sentence project brief\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e28–38\u003c/td\u003e\n\u003ctd\u003eBuild the smallest working version\u003c/td\u003e\n\u003ctd\u003eSomething runs and produces output\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e38–44\u003c/td\u003e\n\u003ctd\u003eCheck a known case and one edge case\u003c/td\u003e\n\u003ctd\u003eA recorded comparison\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e44–50\u003c/td\u003e\n\u003ctd\u003eAdd one mathematically motivated extension\u003c/td\u003e\n\u003ctd\u003eA new example, feature, or experiment\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e50–52\u003c/td\u003e\n\u003ctd\u003eRerun and save the project\u003c/td\u003e\n\u003ctd\u003eA reusable file with short instructions\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cblockquote\u003e\n\u003cp\u003eDriver and checker switch at minute 38.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e29\u003c/span\u003e\u003c/footer\u003e"}, {"id": "section-share", "title": "Share-out", "nav": "Share-out", "layout": "section", "class": "slide layout-section  ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cp class=\"eyebrow\"\u003e5\u003c/p\u003e\u003ch1\u003eShare-out\u003c/h1\u003e\u003cdiv class=\"slide-content\"\u003e\u003cp\u003eThree short demonstrations, then save your work.\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e30\u003c/span\u003e\u003c/footer\u003e"}, {"id": "demonstrations", "title": "Three short demonstrations", "nav": "Three short demonstrations", "layout": "split", "class": "slide layout-split  ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eTwo minutes per pair\u003c/p\u003e\u003ch1\u003eThree short demonstrations\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cp\u003eEach pair shows\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eone output\u003c/strong\u003e,\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eone check\u003c/strong\u003e: how you know it is right,\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eone next question\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eCorrections and surprises count as results.\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"visual \"\u003e\u003col class=\"process-flow\" aria-label=\"State a problem, build something small, inspect the output, check it, refine it\"\u003e\n      \u003cli\u003e\u003cspan class=\"step-index\"\u003e1\u003c/span\u003e\u003cspan\u003eState a problem\u003c/span\u003e\u003c/li\u003e\n      \u003cli\u003e\u003cspan class=\"step-index\"\u003e2\u003c/span\u003e\u003cspan\u003eBuild something small\u003c/span\u003e\u003c/li\u003e\n      \u003cli\u003e\u003cspan class=\"step-index\"\u003e3\u003c/span\u003e\u003cspan\u003eInspect the output\u003c/span\u003e\u003c/li\u003e\n      \u003cli\u003e\u003cspan class=\"step-index\"\u003e4\u003c/span\u003e\u003cspan\u003eCheck it against a known case\u003c/span\u003e\u003c/li\u003e\n      \u003cli\u003e\u003cspan class=\"step-index\"\u003e5\u003c/span\u003e\u003cspan\u003eRefine it, then repeat\u003c/span\u003e\u003c/li\u003e\n    \u003c/ol\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e31\u003c/span\u003e\u003c/footer\u003e"}, {"id": "save", "title": "Before you leave", "nav": "Before you leave", "layout": "standard", "class": "slide layout-standard  ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eSave what you made\u003c/p\u003e\u003ch1\u003eBefore you leave\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cp\u003eKeep four things together:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ethe \u003cstrong\u003efile\u003c/strong\u003e that runs, with a line on how to run it;\u003c/li\u003e\n\u003cli\u003ethe \u003cstrong\u003eprompts\u003c/strong\u003e that worked, including the follow-ups;\u003c/li\u003e\n\u003cli\u003ethe \u003cstrong\u003echeck\u003c/strong\u003e you ran, and its result;\u003c/li\u003e\n\u003cli\u003ethe \u003cstrong\u003enext question\u003c/strong\u003e you would ask.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003eNext time, start from your saved file and your next question, not from a blank prompt.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e32\u003c/span\u003e\u003c/footer\u003e"}, {"id": "closing", "title": "Building small mathematical tools with AI", "nav": "Building small mathematical tools with AI", "layout": "title", "class": "slide layout-title site-home no-sidebar closing-links ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cp class=\"eyebrow\"\u003eSlides and the explorer\u003c/p\u003e\u003ch1\u003eBuilding small mathematical tools with AI\u003c/h1\u003e\u003cdiv class=\"slide-content\"\u003e\u003cp\u003eSlides: \u003ca href=\"https://tbrazel.github.io/talks/ai-workshop/\" rel=\"noopener noreferrer\"\u003etbrazel.github.io/talks/ai-workshop\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eExplorer: \u003ca href=\"https://tbrazel.github.io/talks/ai-workshop/assets/lattice-explorer.html\" rel=\"noopener noreferrer\"\u003elattice-explorer.html\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"assets/qr-slides.svg\" alt=\"QR code for the slides\"\u003e\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-credit\"\u003eSlide template: \u003ca href=\"https://github.com/zengrf/kiwari-slides\" rel=\"noopener noreferrer\"\u003eKiwari slides\u003c/a\u003e by \u003ca href=\"https://zengrf.github.io\" rel=\"noopener noreferrer\"\u003eMichael Zeng\u003c/a\u003e\u003c/span\u003e\u003cspan class=\"slide-number\"\u003e33\u003c/span\u003e\u003c/footer\u003e"}], "records": {}}</script></body></html>
